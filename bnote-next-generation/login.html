<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BNote</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <script src="assets/js/theme-toggle.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/config.js"></script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center">
    <!-- Theme toggle button -->
    <button id="theme-toggle-btn" class="fixed top-4 right-4 h-10 w-10 p-0 hover:bg-muted text-foreground/60 hover:text-foreground transition-colors rounded-md flex items-center justify-center z-50"
        title="Toggle theme" aria-label="Toggle theme">
        <i data-lucide="sun" class="h-5 w-5 hidden dark:block"></i>
        <i data-lucide="moon" class="h-5 w-5 block dark:hidden"></i>
    </button>
    <div class="max-w-md w-full mx-4">
        <!-- Construction tape banner above login form -->
        <div class="construction-tape">
            <div class="construction-tape-text">
                <span class="font-bold">BNote Next Generation</span>
                <i data-lucide="construction" class="h-4 w-4 inline-block"></i>
                <span>Under Construction</span>
            </div>
        </div>
        
        <div class="bg-card shadow-lg rounded-lg p-8 relative overflow-hidden rounded-t-none">
            <div class="text-center mb-8">
                <img id="bnote-logo" alt="BNote" class="h-16 w-16 mx-auto mb-4" style="filter: brightness(0) saturate(100%) invert(58%) sepia(95%) saturate(2878%) hue-rotate(195deg) brightness(102%) contrast(101%);" />
                <h1 class="text-2xl font-bold text-foreground mb-2" data-i18n="js.common.appName">BNote</h1>
                <p class="text-muted-foreground" id="login-welcome-text">Welcome to %p</p>
            </div>
            
            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-foreground mb-2" data-i18n="js.login.usernameLabel">
                        Benutzername oder E-Mail
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        class="w-full px-4 py-2 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-background text-foreground"
                        data-i18n-placeholder="js.login.usernamePlaceholder"
                        placeholder="Benutzername oder E-Mail"
                    />
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-foreground mb-2" data-i18n="js.login.passwordLabel">
                        Passwort
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        class="w-full px-4 py-2 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-background text-foreground"
                        data-i18n-placeholder="js.login.passwordPlaceholder"
                        placeholder="Passwort"
                    />
                </div>
                
                <div id="errorMessage" class="hidden bg-destructive/10 border border-destructive/20 text-destructive-foreground px-4 py-3 rounded-lg text-sm">
                </div>
                
                <button 
                    type="submit" 
                    id="loginButton"
                    class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-2 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
                    data-i18n="js.login.login"
                >
                    Anmelden
                </button>
            </form>
        </div>
    </div>
    
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/routing.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        // Set logo src using global BNote path
        document.addEventListener('DOMContentLoaded', function() {
            const logoImg = document.getElementById('bnote-logo');
            if (logoImg && typeof BNoteConfig !== 'undefined') {
                logoImg.src = BNoteConfig.getBNoteResource('style/images/BNote_Logo_white_transparent.svg');
            }
        });
        
        // Initialize login page
        (async () => {
            // Redirect if already authenticated
            const session = await Auth.checkSession();
            if (session.authenticated) {
                // Check for redirect parameter (preserved URL from before login)
                const urlParams = new URLSearchParams(window.location.search);
                const redirectUrl = urlParams.get('redirect');
                
                if (redirectUrl) {
                    // Redirect to the preserved URL (decoded)
                    window.location.href = decodeURIComponent(redirectUrl);
                } else {
                    // Default: go to dashboard
                    window.location.href = 'app.html?module=dashboard';
                }
                return;
            }
            
            // Load public config (company name, lang, country) and initialize i18n
            const debugCompany = /[?&]debug=1/.test(window.location.search);
            try {
                let raw = null;
                const debugParam = debugCompany ? { debug: '1' } : {};
                if (typeof api !== 'undefined' && api.get) {
                    raw = await api.get('auth', 'getPublicConfig', debugParam);
                } else {
                    const base = window.location.pathname.replace(/\/[^/]*$/, '');
                    const qs = debugCompany ? '&debug=1' : '';
                    const res = await fetch(base + '/api/index.php?module=auth&action=getPublicConfig' + qs);
                    const json = await res.json();
                    raw = json && json.data != null ? json.data : json;
                }
                const config = raw && typeof raw === 'object' ? raw : {};
                if (debugCompany) {
                    console.log('[BNote company debug] raw', raw);
                    console.log('[BNote company debug] config', config);
                    console.log('[BNote company debug] config.company', config.company);
                    if (config._debug) console.log('[BNote company debug] _debug', config._debug);
                }
                if (typeof i18n !== 'undefined') {
                    await i18n.init(config.lang || 'de', config.country || null);
                    if (typeof i18n.translatePage === 'function') {
                        i18n.translatePage();
                    }
                    // Welcome text: "Welcome to {band/company name}"
                    const welcomeEl = document.getElementById('login-welcome-text');
                    if (welcomeEl) {
                        const companyName = (typeof i18n.normalizeCompany === 'function')
                            ? i18n.normalizeCompany(config.company)
                            : (typeof config.company === 'string' ? config.company : '');
                        const welcomeText = (typeof i18n.t === 'function')
                            ? i18n.t('js.dashboard.subtitle', [companyName])
                            : ('Welcome to ' + companyName);
                        welcomeEl.textContent = welcomeText || (companyName ? 'Welcome to ' + companyName : 'Welcome');
                        if (debugCompany) {
                            console.log('[BNote company debug] companyName (used)', companyName);
                            console.log('[BNote company debug] welcomeText', welcomeText);
                        }
                    }
                }
            } catch (error) {
                console.warn('Failed to load public config:', error);
            }
            
            // Initialize theme toggle button
            const themeToggleBtn = document.getElementById('theme-toggle-btn');
            if (themeToggleBtn && typeof ThemeToggle !== 'undefined') {
                themeToggleBtn.addEventListener('click', () => {
                    ThemeToggle.toggle();
                    // Update icons
                    lucide.createIcons();
                });
                // Initialize icons (including construction icon)
                lucide.createIcons();
            } else {
                // Initialize icons even if theme toggle isn't ready
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }
            
            // Handle login form submission
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const errorMessage = document.getElementById('errorMessage');
                const loginButton = document.getElementById('loginButton');
                
                // Hide error message
                errorMessage.classList.add('hidden');
                
                // Disable button and show loading state
                loginButton.disabled = true;
                const t = (k) => (typeof i18n !== 'undefined' && i18n.t ? i18n.t(k) : k);
                loginButton.textContent = t('js.login.loggingIn') || 'Anmeldung...';
                
                try {
                    await Auth.login(username, password);
                    
                    // Check for redirect parameter (preserved URL from before login)
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectUrl = urlParams.get('redirect');
                    
                    if (redirectUrl) {
                        // Redirect to the preserved URL (decoded)
                        window.location.href = decodeURIComponent(redirectUrl);
                    } else {
                        // Default: go to dashboard
                        window.location.href = 'app.html?module=dashboard';
                    }
                } catch (error) {
                    // Show error message
                    const errorMsg = error.message || (t('js.login.loginFailed') || 'Login failed. Please check your credentials.');
                    errorMessage.textContent = errorMsg;
                    errorMessage.classList.remove('hidden');
                    
                    // Re-enable button
                    loginButton.disabled = false;
                    loginButton.textContent = t('js.login.login') || 'Login';
                }
            });
        })();
    </script>
</body>
</html>
