<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNote</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        // Route to login or app based on session
        // Preserve any URL parameters (for deep links opened when logged out)
        (async () => {
            const session = await Auth.checkSession();
            if (session.authenticated) {
                // Check if there's a target URL in query params (from login redirect)
                const urlParams = new URLSearchParams(window.location.search);
                const targetUrl = urlParams.get('redirect');
                
                if (targetUrl) {
                    // Redirect to the target URL (decoded)
                    window.location.href = decodeURIComponent(targetUrl);
                } else {
                    // Default: go to dashboard
                    window.location.href = 'app.html?module=dashboard';
                }
            } else {
                // Not authenticated - preserve current URL as redirect parameter
                const currentUrl = window.location.pathname + window.location.search;
                // Only preserve if it's not index.html itself
                if (currentUrl && !currentUrl.includes('index.html')) {
                    window.location.href = `login.html?redirect=${encodeURIComponent(currentUrl)}`;
                } else {
                    window.location.href = 'login.html';
                }
            }
        })();
    </script>
</head>
<body>
    <div class="flex items-center justify-center min-h-screen">
        <div class="text-center">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary mx-auto"></div>
            <p class="mt-4 text-muted-foreground" data-i18n="js.common.loading">Loading...</p>
        </div>
    </div>
</body>
</html>
