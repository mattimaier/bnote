<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity Detail - BNote</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <script src="assets/js/theme-toggle.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/config.js"></script>
    <!-- Early auth check -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        (async () => {
            try {
                const session = await Auth.checkSession();
                if (!session.authenticated) {
                    // Preserve current URL (including query params) for redirect after login
                    const currentUrl = window.location.pathname + window.location.search;
                    const loginUrl = `login.html?redirect=${encodeURIComponent(currentUrl)}`;
                    
                    // Redirect immediately - prevents any content from rendering
                    window.location.replace(loginUrl);
                    return;
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.replace('login.html');
            }
        })();
    </script>
    <style>
        body {
            visibility: hidden;
        }
        body.auth-checked {
            visibility: visible;
        }
    </style>
</head>
<body class="min-h-screen bg-background">
    <!-- Master-Detail Shell Layout -->
    <div class="flex flex-col md:flex-row h-screen overflow-hidden">
        <!-- Sidebar Container (Master) -->
        <div id="sidebar-container" class="hidden md:block shrink-0 h-full"></div>

        <!-- Main Content Area (Detail) -->
        <div class="flex-1 flex flex-col min-w-0 min-h-0 relative">
            <!-- Top Bar Container -->
            <div id="topbar-container"></div>

            <!-- Mobile Search Overlay Backdrop (only on mobile) -->
            <div id="search-overlay-backdrop" class="hidden fixed inset-0 bg-black/20 dark:bg-black/40 backdrop-blur-sm z-40 md:hidden"></div>
            
            <!-- Mobile Search Overlay (fullscreen below topbar on mobile, overlay on desktop) -->
            <div id="search-overlay" class="hidden fixed top-16 inset-x-0 bottom-0 md:inset-auto md:absolute md:top-16 md:bottom-auto md:max-h-[calc(100vh-4rem)] z-50 bg-card border-t md:border-t-0 md:border-b md:border-x border-border/60 shadow-2xl md:shadow-2xl overflow-y-auto">
                <div id="search-overlay-content" class="pt-2 pb-6 px-4 md:pt-3 md:pb-6 md:px-6">
                    <!-- Content will be dynamically inserted here -->
                </div>
            </div>

            <!-- Detail Area Container -->
            <main id="detail-area" class="px-4 py-4 lg:px-6 flex-1 overflow-y-auto min-h-0">
                <div id="entity-detail-container">
                    <!-- Entity detail will be rendered here -->
                </div>
            </main>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 max-w-[420px]"></div>

    <!-- Participation Modal -->
    <div id="participation-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
        <div class="bg-card rounded-lg shadow-xl p-6 max-w-md w-full mx-4 border border-border">
            <h3 class="text-xl font-semibold mb-4 text-card-foreground"><span data-i18n="js.participation.reasonFor">Reason for </span><span id="modal-status-label"></span></h3>
            <textarea id="participation-reason"
                class="w-full px-3 py-2 border border-border rounded-md text-foreground bg-background focus:outline-none focus:ring-2 focus:ring-primary/30"
                rows="4" data-i18n-placeholder="js.participation.reasonOptional" placeholder="Optional reason..."></textarea>
            <div class="flex gap-3 mt-4 justify-end">
                <button id="modal-cancel" data-i18n="js.common.cancel"
                    class="px-4 py-2 border border-border rounded-md hover:bg-muted transition-colors text-foreground">Cancel</button>
                <button id="modal-confirm" data-i18n="js.common.confirm" class="px-4 py-2 rounded-md text-white transition-colors">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/badge.js"></script>
    <script src="assets/js/user-info.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/mobile-nav.js"></script>
    <script src="assets/js/search.js"></script>
    <script src="assets/js/search-service.js"></script>
    <script src="assets/js/search-results.js"></script>
    <script src="assets/js/search-integration.js"></script>
    <script src="assets/js/router.js"></script>
    <script src="assets/js/navigation-service.js"></script>
    <script src="assets/js/event-detail.js"></script>
    <script src="assets/js/event-renderer.js"></script>
    <script src="assets/js/event-metadata.js"></script>
    <script src="assets/js/participation-constants.js"></script>
    <script src="assets/js/instrument-grouping.js"></script>
    <script src="assets/js/participation.js"></script>
    <script src="assets/js/participation-diagram.js"></script>
    <script src="assets/js/participant-overview.js"></script>
    <script src="assets/js/entity-service.js"></script>
    <!-- Entity Handlers -->
    <script src="assets/js/entity-handlers/rehearsal-handler.js"></script>
    <script src="assets/js/entity-handlers/concert-handler.js"></script>
    <script>
        // Initialize entity detail page
        (async () => {
            document.body.classList.add('auth-checked');
            
            // Render shell components (sidebar, topbar)
            const topbarContainer = document.getElementById('topbar-container');
            if (topbarContainer && typeof Components !== 'undefined') {
                topbarContainer.innerHTML = Components.renderTopbar();
                // Initialize theme toggle
                if (typeof Components.initThemeToggle === 'function') {
                    Components.initThemeToggle();
                }
            }
            
            // Render sidebar
            const sidebarContainer = document.getElementById('sidebar-container');
            if (sidebarContainer && typeof Components !== 'undefined' && typeof Components.renderSidebar === 'function') {
                sidebarContainer.innerHTML = Components.renderSidebar();
            }
            
            const route = Router.parseUrl();
            
            // Initialize sidebar (loads modules)
            if (typeof Sidebar !== 'undefined') {
                await Sidebar.init(route.module);
            }
            
            // Initialize mobile navigation
            if (typeof MobileNav !== 'undefined' && typeof MobileNav.init === 'function') {
                await MobileNav.init();
            }
            
            // Initialize search integration
            if (typeof SearchIntegration !== 'undefined' && typeof SearchIntegration.init === 'function') {
                setTimeout(() => {
                    SearchIntegration.init();
                }, 100);
            }
            
            // Load and render entity detail
            if (typeof EntityService !== 'undefined' && route.entity && route.id) {
                const container = document.getElementById('entity-detail-container');
                await EntityService.renderEntityDetail(route.entity, route.id, route.mode, route.module, container);
            }
            
            // Ensure translations are applied after all content is loaded
            if (typeof i18n !== 'undefined' && typeof i18n.translatePage === 'function') {
                setTimeout(() => {
                    i18n.translatePage();
                }, 200);
            }
        })();
    </script>
</body>
</html>
