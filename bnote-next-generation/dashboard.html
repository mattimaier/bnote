<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BNote</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <script src="assets/js/theme-toggle.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/config.js"></script>
    <!-- Early auth check to prevent content flash -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/routing.js"></script>
    <script>
        // Immediate auth check before any content renders
        // This prevents the dashboard from flashing before redirect to login
        (async () => {
            try {
                const session = await Auth.checkSession();
                if (!session.authenticated) {
                    // Not authenticated - check for deeplink parameters in URL
                    const urlParams = new URLSearchParams(window.location.search);
                    const rehearsalId = urlParams.get('rehearsal');
                    const concertId = urlParams.get('concert');
                    
                    // Build login URL with event parameters if present
                    let loginUrl = 'login.html';
                    if (rehearsalId) {
                        loginUrl = `login.html?rehearsal=${rehearsalId}`;
                    } else if (concertId) {
                        loginUrl = `login.html?concert=${concertId}`;
                    }
                    
                    // Redirect immediately - prevents any dashboard content from rendering
                    window.location.replace(loginUrl);
                    return;
                }
            } catch (error) {
                // On error, redirect to login
                console.error('Auth check failed:', error);
                window.location.replace('login.html');
            }
        })();
    </script>
    <style>
        /* Hide body content until auth check completes */
        body {
            visibility: hidden;
        }
        body.auth-checked {
            visibility: visible;
        }
    </style>
</head>

<body class="min-h-screen bg-background">
    <div class="flex flex-col md:flex-row h-screen overflow-hidden">
        <div id="sidebar-container" class="hidden md:block shrink-0 h-full"></div>

        <!-- Main content area -->
        <div class="flex-1 flex flex-col min-w-0 min-h-0">
        <div id="topbar-container"></div>

        <main class="px-4 py-4 lg:px-6 flex-1 overflow-y-auto min-h-0">
            <!-- Dashboard Container -->
            <div id="dashboard-container">
                <!-- Welcome message - now part of dashboard content -->
                <div class="mb-6 pb-4 border-b border-border/30">
                    <div class="flex flex-col gap-2">
                        <h1 class="text-3xl font-bold tracking-tight text-foreground" id="welcome-greeting">
                        </h1>
                        <p class="text-muted-foreground text-sm font-medium" id="dashboard-subtitle" data-i18n="js.dashboard.subtitle">
                        </p>
                    </div>
                </div>
                <div class="mx-auto max-w-4xl">
                <div class="space-y-4">
                    <!-- Events Needing Response -->
                    <div id="events-needing-response-card"
                        class="md:bg-card md:text-card-foreground flex flex-col gap-4 md:rounded-xl md:border md:border-border/40 py-2 md:py-4 md:shadow-sm md:hover:shadow-md transition-shadow">

                        </div>
                        <div class="px-1 md:px-4 lg:px-5 pb-2 md:pb-3">

                                <span class="text-xs font-medium text-muted-foreground" data-i18n="js.common.filter">Filter:</span>
                                <button class="filter-bubble filter-bubble-rehearsal" data-filter-type="rehearsal"

                                </button>
                                <button class="filter-bubble filter-bubble-performance" data-filter-type="performance"
                                    data-section="events-needing-response" data-i18n-label="js.event.performance">
                                    performance <span class="filter-count text-xs opacity-70 ml-1">(0)</span>
                                </button>
                                <button
                                    class="filter-clear-btn text-xs text-muted-foreground hover:text-foreground px-2 py-1 rounded-md hover:bg-muted/50 transition-colors"
                                    data-section="events-needing-response" data-i18n="js.common.clear">
                                    Clear
                                </button>
                            </div>
                        </div>
                        <div class="px-1 md:px-4 lg:px-5">
                            <!-- Loading skeleton -->
                            <div id="events-needing-response-skeleton" class="relative space-y-2 md:space-y-3">
                                <!-- Mobile skeleton (no timeline) -->
                                <div class="relative md:hidden px-1 pb-2 mb-2 border-b border-border/30">
                                    <div class="h-3 bg-muted animate-pulse rounded w-1/4 mb-1.5"></div>
                                    <div class="h-3 bg-muted animate-pulse rounded w-3/4 mb-1.5"></div>
                                    <div class="h-2.5 bg-muted animate-pulse rounded w-1/2"></div>
                                </div>
                                <!-- Desktop skeleton (with timeline) -->

                                    </div>
                                    <div

                                        <div class="h-4 bg-muted animate-pulse rounded w-1/4 mb-1.5"></div>
                                        <div class="h-4 bg-muted animate-pulse rounded w-3/4 mb-1.5"></div>
                                        <div class="h-3 bg-muted animate-pulse rounded w-1/2"></div>
                                    </div>
                                </div>
                            </div>
                            <!-- Content will be inserted here -->

                            </div>
                        </div>
                    </div>

                    <!-- Events Timeline -->
                    <div id="events-timeline-card"
                        class="md:bg-card md:text-card-foreground flex flex-col gap-4 md:rounded-xl md:border md:border-border/40 py-2 md:py-4 md:shadow-sm md:hover:shadow-md transition-shadow">
                        <div class="px-1 md:px-4 lg:px-5 pb-2 md:border-b md:border-border/30">
                            <h2 class="text-sm md:text-base font-semibold text-foreground" data-i18n="js.dashboard.upcomingEvents">Upcoming Events</h2>
                        </div>
                        <div class="px-1 md:px-4 lg:px-5 pb-2 md:pb-3">
                            <div class="flex items-center gap-3 flex-wrap">
                                <span class="text-xs font-medium text-muted-foreground" data-i18n="js.common.filter">Filter:</span>
                                <button class="filter-bubble filter-bubble-rehearsal" data-filter-type="rehearsal"
                                    data-section="events-timeline" data-i18n-label="js.event.rehearsal">

                                </button>
                                <button class="filter-bubble filter-bubble-performance" data-filter-type="performance"

                                    performance <span class="filter-count text-xs opacity-70 ml-1">(0)</span>
                                </button>
                                <button
                                    class="filter-clear-btn text-xs text-muted-foreground hover:text-foreground px-2 py-1 rounded-md hover:bg-muted/50 transition-colors"
                                    data-section="events-timeline" data-i18n="js.common.clear">
                                    Clear
                                </button>
                            </div>
                        </div>
                        <div class="px-1 md:px-4 lg:px-5">
                            <!-- Loading skeleton -->
                            <div id="events-timeline-skeleton" class="relative space-y-2 md:space-y-3">
                                <!-- Mobile skeleton (no timeline) -->
                                <div class="relative md:hidden px-1 pb-2 mb-2 border-b border-border/30">
                                    <div class="h-3 bg-muted animate-pulse rounded w-1/4 mb-1.5"></div>
                                    <div class="h-3 bg-muted animate-pulse rounded w-3/4 mb-1.5"></div>
                                    <div class="h-2.5 bg-muted animate-pulse rounded w-1/2"></div>
                                </div>
                                <!-- Desktop skeleton (with timeline) -->
                                <div class="hidden md:flex relative gap-3">
                                    <div
                                        class="relative z-10 mt-0.5 h-7 w-7 shrink-0 rounded-full bg-muted animate-pulse ring-3 ring-background shadow-sm">
                                    </div>
                                    <div
                                        class="flex-1 rounded-lg border border-border/40 bg-gradient-to-br from-muted/20 to-transparent p-3">
                                        <div class="h-4 bg-muted animate-pulse rounded w-1/4 mb-1.5"></div>
                                        <div class="h-4 bg-muted animate-pulse rounded w-3/4 mb-1.5"></div>
                                        <div class="h-3 bg-muted animate-pulse rounded w-1/2"></div>
                                    </div>
                                </div>
                            </div>
                            <!-- Content will be inserted here -->
                            <div id="events-timeline-content" class="relative space-y-2 md:space-y-3 hidden"></div>
                        </div>
                    </div>

                    <!-- Quick Actions (hidden for now) -->
                    <div id="quick-actions-card" class="hidden
                        bg-card text-card-foreground flex flex-col gap-4 rounded-xl border border-border/40 py-4 shadow-sm hover:shadow-md transition-shadow">
                        <div class="px-4 lg:px-5 pb-2 border-b border-border/30">
                            <h2 class="text-base font-semibold text-foreground" data-i18n="js.dashboard.quickActions">Quick Actions</h2>
                        </div>
                        <div class="px-4 lg:px-5 pt-3">
                            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3" id="quick-actions-content">
                                <!-- Quick actions will be inserted here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
            
            <!-- Event Detail View Container (hidden by default) -->
            <div id="event-detail-container" class="hidden">
                <div class="mb-4">
                    <button 
                        id="back-to-dashboard" 
                        onclick="EventDetail.navigateBack()"

                    >
                        <i data-lucide="arrow-left" class="h-4 w-4"></i>
                        <span data-i18n="js.dashboard.backToDashboard">Back to Dashboard</span>
                    </button>
                </div>
                <div id="event-detail-content" class="mx-auto max-w-4xl">
                    <!-- Rendered by EventDetail component -->
                </div>
            </div>
            
            <!-- Search Results View Container (hidden by default) -->
            <div id="search-results-container" class="hidden">
                <div class="mb-4">
                    <button 
                        id="back-to-dashboard-from-search" 
                        onclick="SearchResultsPage.navigateBack()"
                        class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-foreground hover:text-primary bg-muted/50 hover:bg-muted rounded-lg transition-colors"
                    >
                        <i data-lucide="arrow-left" class="h-4 w-4"></i>
                        <span data-i18n="js.dashboard.backToDashboard">Back to Dashboard</span>
                    </button>
                </div>
                <div id="search-results-content" class="mx-auto max-w-4xl">
                    <!-- Rendered by SearchResultsPage component -->
                </div>
            </div>
        </main>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 max-w-[420px]"></div>

    <!-- Participation Modal -->
    <div id="participation-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
        <div class="bg-card rounded-lg shadow-xl p-6 max-w-md w-full mx-4 border border-border">
            <h3 class="text-xl font-semibold mb-4 text-card-foreground"><span data-i18n="js.participation.reasonFor">Reason for </span><span id="modal-status-label"></span></h3>
            <textarea id="participation-reason"
                class="w-full px-3 py-2 border border-border rounded-md text-foreground bg-background focus:outline-none focus:ring-2 focus:ring-primary/30"
                rows="4" data-i18n-placeholder="js.participation.reasonOptional" placeholder="Optional reason..."></textarea>
            <div class="flex gap-3 mt-4 justify-end">
                <button id="modal-cancel" data-i18n="js.common.cancel"
                    class="px-4 py-2 border border-border rounded-md hover:bg-muted transition-colors text-foreground">Cancel</button>
                <button id="modal-confirm" data-i18n="js.common.confirm" class="px-4 py-2 rounded-md text-white transition-colors">Confirm</button>
            </div>
        </div>

    <!-- API, Auth, and Routing already loaded in head for early auth check -->
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/badge.js"></script>
    <script src="assets/js/user-info.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/mobile-nav.js"></script>
    <script src="assets/js/participation-constants.js"></script>
    <script src="assets/js/instrument-grouping.js"></script>
    <script src="assets/js/participation.js"></script>
    <script src="assets/js/participation-diagram.js"></script>
    <script src="assets/js/participant-overview.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script src="assets/js/event-metadata.js"></script>
    <script src="assets/js/event-detail.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script src="assets/js/search.js"></script>
    <script src="assets/js/search-results.js"></script>
    <script src="assets/js/search-filters.js"></script>
    <script src="assets/js/search-integration.js"></script>
    <script src="assets/js/search-results-page.js"></script>
    <script>
        // Hide content until translations are loaded
        document.documentElement.classList.add('i18n-loading');
        
        (async () => {
            try {
                // Wait for DOM
                if (document.readyState === 'loading') {
                    await new Promise(resolve => document.addEventListener('DOMContentLoaded', resolve));
                }
                
                // Wait briefly for scripts
                let attempts = 0;
                while ((typeof Components === 'undefined' || typeof Dashboard === 'undefined' || typeof App === 'undefined' || typeof i18n === 'undefined' || typeof EventDetail === 'undefined') && attempts < 20) {
                    await new Promise(resolve => setTimeout(resolve, 50));
                    attempts++;
                }
                
                // Check authentication (already checked in head, but verify again)
                const session = await Auth.checkSession();
                if (!session.authenticated) {
                    // Should not happen if head script worked, but fallback
                    window.location.href = 'login.html';
                    return;
                }
                
                // Mark auth check as complete - show content
                document.body.classList.add('auth-checked');
                
                // Initialize i18n immediately
                if (typeof App !== 'undefined' && typeof i18n !== 'undefined') {
                    await App.initI18n();
                }
                
                // Render components
                const sidebarContainer = document.getElementById('sidebar-container');
                const topbarContainer = document.getElementById('topbar-container');
                
                if (sidebarContainer) {
                    sidebarContainer.innerHTML = Components.renderSidebar();
                }
                if (topbarContainer) {
                    topbarContainer.innerHTML = Components.renderTopbar({
                        searchPlaceholder: 'Search everything...',
                        searchPlaceholderI18n: 'js.search.placeholder'
                    });
                }
                
                // Initialize components first
                if (typeof UserInfo !== 'undefined') {
                    await UserInfo.init(session);
                }
                await Sidebar.init('dashboard');
                await MobileNav.init();
                Components.initThemeToggle();
                
                // Initialize dashboard (this will render content)
                await Dashboard.init(session);
                
                // Translate page elements AFTER dashboard init (to override any English text)
                if (typeof i18n !== 'undefined' && typeof i18n.translatePage === 'function') {
                    i18n.translatePage();
                    // Also call Dashboard's translatePage to update welcome greeting
                    if (typeof Dashboard.translatePage === 'function') {
                        Dashboard.translatePage();
                    }
                }
                
                // Initialize icons after translation
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
                
                // Check for search parameters in URL first
                const urlParams = new URLSearchParams(window.location.search);
                const searchQuery = urlParams.get('search');
                
                if (searchQuery && searchQuery.trim().length >= 2 && typeof SearchResultsPage !== 'undefined') {
                    // Show search results page instead of dashboard
                    const filters = {};
                    const year = urlParams.get('year');
                    if (year) filters.date_year = parseInt(year);
                    const month = urlParams.get('month');
                    if (month) filters.date_month = parseInt(month);
                    const moduleType = urlParams.get('module_type');
                    if (moduleType) filters.module_type = moduleType;
                    
                    try {
                        await SearchResultsPage.init(searchQuery.trim(), filters);
                    } catch (error) {
                        console.error('Failed to initialize search results:', error);
                    }
                } else {
                    // Check for event parameters in URL or sessionStorage
                    let eventToShow = null;
                    
                    // First, check URL parameters
                    const eventFromUrl = Routing.getEventFromUrl();
                    if (eventFromUrl) {
                        eventToShow = eventFromUrl;
                        // Store in sessionStorage in case of redirect
                        Routing.storePendingNavigation(eventFromUrl.type, eventFromUrl.id);
                    } else {
                        // Check sessionStorage for pending navigation (from login redirect)
                        const pendingNav = Routing.getPendingNavigation();
                        if (pendingNav) {
                            eventToShow = pendingNav;
                        }
                    }
                    
                    // If event found, initialize EventDetail after dashboard loads
                    if (eventToShow && typeof EventDetail !== 'undefined') {
                        // Initialize event detail view
                        // Note: EventDetail.init() will update the URL with pushState to maintain the correct format
                        try {
                            await EventDetail.init(eventToShow.type, eventToShow.id);
                        } catch (error) {
                            console.error('Failed to initialize event detail:', error);
                            // Error is already shown by EventDetail component
                        }
                    }
                }
                
                // Handle browser back/forward buttons
                window.addEventListener('popstate', (event) => {
                    if (event.state) {
                        if (event.state.view === 'search-results') {
                            // User navigated to search results via history
                            if (typeof SearchResultsPage !== 'undefined') {
                                SearchResultsPage.init(event.state.query, event.state.filters || {});
                            }
                        } else if (event.state.view === 'event-detail') {
                            // User navigated to event detail via history
                            if (typeof EventDetail !== 'undefined') {
                                EventDetail.init(event.state.eventType, event.state.eventId);
                            }
                        } else {
                            // User navigated back to dashboard
                            if (typeof EventDetail !== 'undefined') {
                                EventDetail.navigateBack();
                            }
                            if (typeof SearchResultsPage !== 'undefined') {
                                SearchResultsPage.navigateBack();
                            }
                        }
                    } else {
                        // No state - check URL for search or event params
                        const urlParams = new URLSearchParams(window.location.search);
                        const searchQuery = urlParams.get('search');
                        
                        if (searchQuery && searchQuery.trim().length >= 2 && typeof SearchResultsPage !== 'undefined') {
                            const filters = {};
                            const year = urlParams.get('year');
                            if (year) filters.date_year = parseInt(year);
                            const month = urlParams.get('month');
                            if (month) filters.date_month = parseInt(month);
                            const moduleType = urlParams.get('module_type');
                            if (moduleType) filters.module_type = moduleType;
                            SearchResultsPage.init(searchQuery.trim(), filters);
                        } else {
                            // Show dashboard
                            if (typeof EventDetail !== 'undefined') {
                                EventDetail.navigateBack();
                            }
                            if (typeof SearchResultsPage !== 'undefined') {
                                SearchResultsPage.navigateBack();
                            }
                        }
                    }
                });
                
                // Show content
                document.documentElement.classList.remove('i18n-loading');
            } catch (error) {
                console.error('Initialization error:', error);
                document.documentElement.classList.remove('i18n-loading');
                
                const isAuthError = error.message && (
                    error.message.includes('Unauthorized') ||
                    error.message.includes('403') ||
                    error.message.includes('not authenticated') ||
                    error.status === 403
                );
                
                if (isAuthError) {
                    window.location.href = 'login.html';
                }
            }
        })();
    </script>
</body>

</html>
