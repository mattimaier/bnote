name: User Guide Quality

on:
  pull_request:
    paths:
      - "user-guide/**"
      - ".github/workflows/user-guide-quality.yml"
      - ".github/scripts/check_user_guide_parity.py"
  workflow_dispatch:

jobs:
  markdown-and-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            user-guide/**/*.md

      - name: Critical language parity check
        run: python3 .github/scripts/check_user_guide_parity.py
