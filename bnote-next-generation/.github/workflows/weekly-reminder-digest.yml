name: BNote Reminder Digest

on:
  schedule:
    # Once per week on Sunday at 19:00 UTC; app settings still decide due time.
    - cron: "0 19 * * 0"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "If true, run without sending emails"
        required: false
        default: true
        type: boolean
      force:
        description: "If true, bypass due-time gating (admin/operator use)"
        required: false
        default: false
        type: boolean
      bugLog:
        description: "If true, enable verbose uncensored debugging logs"
        required: false
        default: false
        type: boolean
      onlyUserId:
        description: "Optional: if set, process reminders only for this user ID"
        required: false
        type: string

jobs:
  run-reminder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate required secrets
        env:
          SECRET_ENDPOINT: ${{ secrets.BNOTE_NEXT_GENERATION_REMINDER_ENDPOINT }}
          SECRET: ${{ secrets.BNOTE_NEXT_GENERATION_REMINDER_SECRET }}
        run: |
          set -euo pipefail
          echo "::group::Reminder secret validation"
          echo "Workflow: ${GITHUB_WORKFLOW}"
          echo "Event name: ${GITHUB_EVENT_NAME}"
          echo "Ref: ${GITHUB_REF}"
          echo "Run id: ${GITHUB_RUN_ID}"
          test -n "${SECRET}" || { echo "Missing BNOTE_NEXT_GENERATION_REMINDER_SECRET secret"; exit 1; }
          SECRET_SHA256="$(printf '%s' "${SECRET}" | openssl dgst -sha256 -hex | sed 's/^.* //')"
          echo "Secret fingerprint (sha256, first 16): ${SECRET_SHA256:0:16}"
          if [ -n "${SECRET_ENDPOINT:-}" ]; then
            echo "Secret endpoint configured: yes"
            echo "Secret endpoint value: ${SECRET_ENDPOINT}"
          else
            echo "Secret endpoint configured: no"
          fi
          if [ -z "${SECRET_ENDPOINT:-}" ]; then
            echo "Missing BNOTE_NEXT_GENERATION_REMINDER_ENDPOINT secret"
            exit 1
          fi
          echo "::endgroup::"

      - name: Call signed reminder endpoint
        env:
          SECRET_ENDPOINT: ${{ secrets.BNOTE_NEXT_GENERATION_REMINDER_ENDPOINT }}
          SECRET: ${{ secrets.BNOTE_NEXT_GENERATION_REMINDER_SECRET }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dryRun }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
          INPUT_BUG_LOG: ${{ github.event.inputs.bugLog }}
          INPUT_ONLY_USER_ID: ${{ github.event.inputs.onlyUserId }}
        run: |
          set -euo pipefail

          echo "::group::Reminder trigger context"
          echo "Workflow: ${GITHUB_WORKFLOW}"
          echo "Event name: ${GITHUB_EVENT_NAME}"
          echo "Actor: ${GITHUB_ACTOR}"
          echo "Run id: ${GITHUB_RUN_ID}"
          echo "Run attempt: ${GITHUB_RUN_ATTEMPT}"
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          echo "SHA: ${GITHUB_SHA}"
          echo "::endgroup::"

          # Safe default: no sending unless explicitly turned off.
          DRY_RUN="${INPUT_DRY_RUN:-true}"
          FORCE_RUN="${INPUT_FORCE:-false}"
          BUG_LOG="${INPUT_BUG_LOG:-false}"
          ONLY_USER_ID="$(printf '%s' "${INPUT_ONLY_USER_ID:-}" | xargs)"
          BUG_LOG="$(printf '%s' "${BUG_LOG}" | tr '[:upper:]' '[:lower:]')"
          case "${BUG_LOG}" in
            1|true|yes|on) BUG_LOG=true ;;
            *) BUG_LOG=false ;;
          esac
          if [ -n "${ONLY_USER_ID}" ]; then
            case "${ONLY_USER_ID}" in
              ''|*[!0-9]*)
                echo "Invalid onlyUserId input (must be digits only): ${ONLY_USER_ID}"
                exit 1
                ;;
            esac
            if [ "${ONLY_USER_ID}" = "0" ]; then
              echo "Invalid onlyUserId input (must be > 0)."
              exit 1
            fi
          fi
          export DRY_RUN FORCE_RUN BUG_LOG ONLY_USER_ID
          ENDPOINT="${SECRET_ENDPOINT:-}"
          export ENDPOINT
          test -n "${ENDPOINT}" || { echo "No endpoint available"; exit 1; }

          echo "::group::Reminder request parameters"
          echo "Endpoint source: GitHub secret BNOTE_NEXT_GENERATION_REMINDER_ENDPOINT"
          echo "dryRun input: ${DRY_RUN}"
          echo "force input: ${FORCE_RUN}"
          echo "bugLog input: ${BUG_LOG}"
          echo "onlyUserId input: ${ONLY_USER_ID:-<not set>}"
          echo "Endpoint URL: ${ENDPOINT}"
          ENDPOINT_SCHEME="$(python3 -c 'import os, urllib.parse; u=urllib.parse.urlparse(os.environ["ENDPOINT"]); print(u.scheme)')"
          ENDPOINT_HOST="$(python3 -c 'import os, urllib.parse; u=urllib.parse.urlparse(os.environ["ENDPOINT"]); print(u.netloc)')"
          ENDPOINT_PATH="$(python3 -c 'import os, urllib.parse; u=urllib.parse.urlparse(os.environ["ENDPOINT"]); print(u.path or "/")')"
          echo "Endpoint scheme: ${ENDPOINT_SCHEME}"
          echo "Endpoint host: ${ENDPOINT_HOST}"
          echo "Endpoint path: ${ENDPOINT_PATH}"
          echo "::endgroup::"

          BODY="$(python3 -c 'import json, os; b=lambda v: str(v).strip().lower() in ("1","true","yes","on"); payload={"dryRun": b(os.environ.get("DRY_RUN","true")), "force": b(os.environ.get("FORCE_RUN","false"))}; uid=str(os.environ.get("ONLY_USER_ID","")).strip(); payload["onlyUserId"]=int(uid) if uid.isdigit() and int(uid)>0 else payload.get("onlyUserId"); payload = {k:v for k,v in payload.items() if v is not None}; print(json.dumps(payload, separators=(",", ":")))' )"

          TS="$(date +%s)"
          ISO_TS="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          NONCE="$(openssl rand -hex 16)"
          PATH_ONLY="$(python3 -c 'import os, urllib.parse; u = urllib.parse.urlparse(os.environ["ENDPOINT"]); print(u.path or "/")')"
          CANONICAL="POST|${PATH_ONLY}|${TS}|${NONCE}|${BODY}"
          SIG="$(printf '%s' "${CANONICAL}" | openssl dgst -sha256 -hmac "${SECRET}" -hex | sed 's/^.* //')"

          echo "::group::Reminder signing details (safe)"
          echo "Timestamp (epoch): ${TS}"
          echo "Timestamp (UTC): ${ISO_TS}"
          echo "Nonce: ${NONCE}"
          echo "Path used for signature: ${PATH_ONLY}"
          echo "Request body: ${BODY}"
          echo "Canonical payload: ${CANONICAL}"
          echo "Signature length: ${#SIG} hex chars"
          if [ "${BUG_LOG}" = "true" ]; then
            echo "Signature: ${SIG}"
          else
            echo "Signature prefix: ${SIG:0:12}..."
          fi
          echo "::endgroup::"

          echo "::group::Reminder curl command"
          if [ "${BUG_LOG}" = "true" ]; then
            echo "curl --location --request POST '${ENDPOINT}' \\"
            echo "  --header 'Content-Type: application/json' \\"
            echo "  --header 'X-Reminder-Timestamp: ${TS}' \\"
            echo "  --header 'X-Reminder-Nonce: ${NONCE}' \\"
            echo "  --header 'X-Reminder-Signature: ${SIG}' \\"
            echo "  --data '${BODY}'"
          else
            echo "curl --location --request POST '${ENDPOINT}' \\"
            echo "  --header 'Content-Type: application/json' \\"
            echo "  --header 'X-Reminder-Timestamp: ${TS}' \\"
            echo "  --header 'X-Reminder-Nonce: ${NONCE}' \\"
            echo "  --header 'X-Reminder-Signature: <redacted>' \\"
            echo "  --data '${BODY}'"
          fi
          echo "::endgroup::"

          echo "::group::Reminder endpoint response"
          HTTP_CODE="$(curl --show-error --silent --location --verbose \
            -X POST "${ENDPOINT}" \
            -H "Content-Type: application/json" \
            -H "X-Reminder-Timestamp: ${TS}" \
            -H "X-Reminder-Nonce: ${NONCE}" \
            -H "X-Reminder-Signature: ${SIG}" \
            --data "${BODY}" \
            --dump-header response-headers.txt \
            --output response.json \
            2>curl-verbose.txt \
            --write-out '%{http_code}')"
          echo "HTTP status: ${HTTP_CODE}"
          echo "--- Response headers ---"
          cat response-headers.txt
          echo "Response body:"
          cat response.json
          echo "--- curl verbose (SSL noise filtered) ---"
          if [ "${BUG_LOG}" = "true" ]; then
            awk '!/SSL data/ && !/TLSv1\./ && !/CAfile:/ && !/CApath:/ && !/^[{}] \[[0-9]+ bytes data\]$/ && !/Newsession Ticket/ && !/CERT verify/ && !/change cipher/' curl-verbose.txt
          else
            sed -E 's/(X-Reminder-Signature: )[a-f0-9]+/\1<redacted>/I' curl-verbose.txt \
              | awk '!/SSL data/ && !/TLSv1\./ && !/CAfile:/ && !/CApath:/ && !/^[{}] \[[0-9]+ bytes data\]$/ && !/Newsession Ticket/ && !/CERT verify/ && !/change cipher/'
          fi
          case "${HTTP_CODE}" in
            2* ) ;;
            * )
              echo "Reminder request failed with HTTP status ${HTTP_CODE}"
              exit 1
              ;;
          esac
          echo "::endgroup::"
