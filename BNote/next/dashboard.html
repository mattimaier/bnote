<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BNote</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen bg-background flex flex-col lg:flex-row">
    <!-- Left module sidebar - Always visible on desktop, toggleable on mobile -->
    <aside id="sidebar"
        class="flex flex-col h-screen bg-sidebar border-r border-sidebar-border transition-all duration-300 fixed inset-y-0 left-0 z-[60] w-64 xl:translate-x-0 -translate-x-full">
        <!-- Header with brand -->
        <div id="sidebar-header" class="flex items-center justify-between px-4 py-5 border-b border-sidebar-border/50">
            <div id="sidebar-brand" class="flex items-center gap-3">
                <div
                    class="h-9 w-9 rounded-lg bg-gradient-to-br from-primary/30 to-primary/10 flex items-center justify-center ring-1 ring-primary/20">
                    <img src="../style/images/BNote_Logo_white_transparent.svg" alt="BNote" class="h-5 w-5" style="filter: brightness(0) saturate(100%) invert(58%) sepia(95%) saturate(2878%) hue-rotate(195deg) brightness(102%) contrast(101%);" />
                </div>
                <div class="flex flex-col">
                    <span class="font-semibold text-sidebar-foreground text-sm">BNote</span>
                </div>
            </div>
            <button id="sidebar-collapse-btn"
                class="h-8 w-8 p-0 hover:bg-sidebar-accent/80 text-sidebar-foreground/60 hover:text-sidebar-foreground transition-colors rounded-md flex items-center justify-center"
                title="Collapse sidebar">
                <i data-lucide="chevron-left" class="h-4 w-4"></i>
            </button>
        </div>

        <!-- Modules list -->
        <nav id="sidebar-nav" class="flex-1 overflow-y-auto p-3 space-y-1.5">
            <!-- Modules will be dynamically loaded here -->
        </nav>
    </aside>

    <!-- Overlay for mobile/tablet when sidebar is open -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/30 xl:hidden z-30 hidden"
        onclick="Sidebar.toggleSidebar()"></div>

    <!-- Main content area -->
    <div class="flex-1 flex flex-col min-w-0 xl:ml-64">
        <!-- Top Header Bar -->
        <header
            class="sticky top-0 z-50 w-full border-b border-border/40 bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/60">
            <div class="flex h-16 items-center justify-between px-4 lg:px-6 gap-4">
                <!-- Menu button - visible on mobile and tablet (compact devices) -->
                <button id="mobile-menu-btn"
                    class="xl:hidden h-9 w-9 text-muted-foreground hover:text-foreground hover:bg-muted/60 rounded-md flex items-center justify-center"
                    onclick="Sidebar.toggleSidebar()" title="Toggle menu">
                    <i data-lucide="menu" class="h-5 w-5"></i>
                </button>

                <!-- Left: Search - hidden on mobile -->
                <div class="hidden md:flex flex-1 max-w-sm">
                    <div class="relative w-full">
                        <i data-lucide="search"
                            class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground/60"></i>
                        <input type="text" data-i18n-placeholder="js.dashboard.searchPlaceholder" placeholder="Search events, members..."
                            class="pl-9 h-9 bg-muted/40 border-transparent text-sm focus:border-input focus:bg-muted/60 focus:ring-1 focus:ring-primary/30 rounded-md w-full px-3" />
                    </div>
                </div>

                <!-- Right side actions -->
                <div class="flex items-center gap-2 ml-auto">
                    <div class="h-6 w-px bg-border/30 hidden sm:block"></div>
                    <button
                        class="flex items-center gap-3 pl-3 pr-2 py-1 rounded-lg hover:bg-muted/50 transition-colors group"
                        onclick="Auth.logout()">
                        <div class="h-8 w-8 rounded-full bg-primary/10 text-primary font-semibold text-xs flex items-center justify-center ring-1.5 ring-primary/20 group-hover:ring-primary/40 transition-all"
                            id="user-avatar">
                            <span id="user-initials">U</span>
                        </div>
                        <div class="hidden sm:block text-left">
                            <p class="text-xs font-semibold leading-tight text-foreground" id="user-name">User</p>
                            <span
                                class="inline-flex items-center rounded-md border px-1.5 py-0.5 text-[10px] mt-0.5 bg-muted text-muted-foreground border-border"
                                id="user-role" data-i18n="js.common.member">Member</span>
                        </div>
                    </button>
                </div>
            </div>
        </header>

        <main class="px-4 py-4 lg:px-6 flex-1 overflow-y-auto">
            <!-- Dashboard Container -->
            <div id="dashboard-container">
                <!-- Welcome message - now part of dashboard content -->
                <div class="mb-6 pb-4 border-b border-border/30">
                    <div class="flex flex-col gap-2">
                        <h1 class="text-3xl font-bold tracking-tight text-foreground" id="welcome-greeting">
                            Welcome
                        </h1>
                        <p class="text-muted-foreground text-sm font-medium" id="dashboard-subtitle" data-i18n="js.dashboard.subtitle">
                            Welcome to BNote
                        </p>
                    </div>
                </div>
                <div class="mx-auto max-w-4xl">
                <div class="space-y-4">
                    <!-- Events Needing Response -->
                    <div id="events-needing-response-card"
                        class="md:bg-card md:text-card-foreground flex flex-col gap-4 md:rounded-xl md:border md:border-border/40 py-2 md:py-4 md:shadow-sm md:hover:shadow-md transition-shadow">
                        <div class="px-1 md:px-4 lg:px-5 pb-2 md:border-b md:border-border/30">
                            <h2 class="text-sm md:text-base font-semibold text-foreground" data-i18n="js.dashboard.responseNeeded">Your Response Needed</h2>
                        </div>
                        <div class="px-1 md:px-4 lg:px-5 pb-2 md:pb-3">
                            <div class="flex items-center gap-3 flex-wrap">
                                <span class="text-xs font-medium text-muted-foreground" data-i18n="js.common.filter">Filter:</span>
                                <button class="filter-bubble filter-bubble-rehearsal" data-filter-type="rehearsal"
                                    data-section="events-needing-response" data-i18n-label="js.event.rehearsal">
                                    rehearsal <span class="filter-count text-xs opacity-70 ml-1">(0)</span>
                                </button>
                                <button class="filter-bubble filter-bubble-performance" data-filter-type="performance"
                                    data-section="events-needing-response" data-i18n-label="js.event.performance">
                                    performance <span class="filter-count text-xs opacity-70 ml-1">(0)</span>
                                </button>
                                <button class="filter-bubble filter-bubble-meeting" data-filter-type="meeting"
                                    data-section="events-needing-response" data-i18n-label="js.event.meeting">
                                    meeting <span class="filter-count text-xs opacity-70 ml-1">(0)</span>
                                </button>
                                <button
                                    class="filter-clear-btn text-xs text-muted-foreground hover:text-foreground px-2 py-1 rounded-md hover:bg-muted/50 transition-colors"
                                    data-section="events-needing-response" data-i18n="js.common.clear">
                                    Clear
                                </button>
                            </div>
                        </div>
                        <div class="px-1 md:px-4 lg:px-5">
                            <!-- Loading skeleton -->
                            <div id="events-needing-response-skeleton" class="relative space-y-2 md:space-y-3">
                                <!-- Mobile skeleton (no timeline) -->
                                <div class="relative md:hidden px-1 pb-2 mb-2 border-b border-border/30">
                                    <div class="h-3 bg-muted animate-pulse rounded w-1/4 mb-1.5"></div>
                                    <div class="h-3 bg-muted animate-pulse rounded w-3/4 mb-1.5"></div>
                                    <div class="h-2.5 bg-muted animate-pulse rounded w-1/2"></div>
                                </div>
                                <!-- Desktop skeleton (with timeline) -->
                                <div class="hidden md:flex relative gap-3">
                                    <div
                                        class="relative z-10 mt-0.5 h-7 w-7 shrink-0 rounded-full bg-muted animate-pulse ring-3 ring-background shadow-sm">
                                    </div>
                                    <div
                                        class="flex-1 rounded-lg border border-border/40 bg-gradient-to-br from-muted/20 to-transparent p-3">
                                        <div class="h-4 bg-muted animate-pulse rounded w-1/4 mb-1.5"></div>
                                        <div class="h-4 bg-muted animate-pulse rounded w-3/4 mb-1.5"></div>
                                        <div class="h-3 bg-muted animate-pulse rounded w-1/2"></div>
                                    </div>
                                </div>
                            </div>
                            <!-- Content will be inserted here -->
                            <div id="events-needing-response-content" class="relative space-y-2 md:space-y-3 hidden">
                            </div>
                        </div>
                    </div>

                    <!-- Events Timeline -->
                    <div id="events-timeline-card"
                        class="md:bg-card md:text-card-foreground flex flex-col gap-4 md:rounded-xl md:border md:border-border/40 py-2 md:py-4 md:shadow-sm md:hover:shadow-md transition-shadow">
                        <div class="px-1 md:px-4 lg:px-5 pb-2 md:border-b md:border-border/30">
                            <h2 class="text-sm md:text-base font-semibold text-foreground" data-i18n="js.dashboard.upcomingEvents">Upcoming Events</h2>
                        </div>
                        <div class="px-1 md:px-4 lg:px-5 pb-2 md:pb-3">
                            <div class="flex items-center gap-3 flex-wrap">
                                <span class="text-xs font-medium text-muted-foreground" data-i18n="js.common.filter">Filter:</span>
                                <button class="filter-bubble filter-bubble-rehearsal" data-filter-type="rehearsal"
                                    data-section="events-timeline" data-i18n-label="js.event.rehearsal">
                                    rehearsal <span class="filter-count text-xs opacity-70 ml-1">(0)</span>
                                </button>
                                <button class="filter-bubble filter-bubble-performance" data-filter-type="performance"
                                    data-section="events-timeline" data-i18n-label="js.event.performance">
                                    performance <span class="filter-count text-xs opacity-70 ml-1">(0)</span>
                                </button>
                                <button class="filter-bubble filter-bubble-meeting" data-filter-type="meeting"
                                    data-section="events-timeline" data-i18n-label="js.event.meeting">
                                    meeting <span class="filter-count text-xs opacity-70 ml-1">(0)</span>
                                </button>
                                <button
                                    class="filter-clear-btn text-xs text-muted-foreground hover:text-foreground px-2 py-1 rounded-md hover:bg-muted/50 transition-colors"
                                    data-section="events-timeline" data-i18n="js.common.clear">
                                    Clear
                                </button>
                            </div>
                        </div>
                        <div class="px-1 md:px-4 lg:px-5">
                            <!-- Loading skeleton -->
                            <div id="events-timeline-skeleton" class="relative space-y-2 md:space-y-3">
                                <!-- Mobile skeleton (no timeline) -->
                                <div class="relative md:hidden px-1 pb-2 mb-2 border-b border-border/30">
                                    <div class="h-3 bg-muted animate-pulse rounded w-1/4 mb-1.5"></div>
                                    <div class="h-3 bg-muted animate-pulse rounded w-3/4 mb-1.5"></div>
                                    <div class="h-2.5 bg-muted animate-pulse rounded w-1/2"></div>
                                </div>
                                <!-- Desktop skeleton (with timeline) -->
                                <div class="hidden md:flex relative gap-3">
                                    <div
                                        class="relative z-10 mt-0.5 h-7 w-7 shrink-0 rounded-full bg-muted animate-pulse ring-3 ring-background shadow-sm">
                                    </div>
                                    <div
                                        class="flex-1 rounded-lg border border-border/40 bg-gradient-to-br from-muted/20 to-transparent p-3">
                                        <div class="h-4 bg-muted animate-pulse rounded w-1/4 mb-1.5"></div>
                                        <div class="h-4 bg-muted animate-pulse rounded w-3/4 mb-1.5"></div>
                                        <div class="h-3 bg-muted animate-pulse rounded w-1/2"></div>
                                    </div>
                                </div>
                            </div>
                            <!-- Content will be inserted here -->
                            <div id="events-timeline-content" class="relative space-y-2 md:space-y-3 hidden"></div>
                        </div>
                    </div>

                    <!-- Quick Actions -->
                    <div id="quick-actions-card"
                        class="bg-card text-card-foreground flex flex-col gap-4 rounded-xl border border-border/40 py-4 shadow-sm hover:shadow-md transition-shadow">
                        <div class="px-4 lg:px-5 pb-2 border-b border-border/30">
                            <h2 class="text-base font-semibold text-foreground" data-i18n="js.dashboard.quickActions">Quick Actions</h2>
                        </div>
                        <div class="px-4 lg:px-5 pt-3">
                            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3" id="quick-actions-content">
                                <!-- Quick actions will be inserted here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
            
            <!-- Event Detail View Container (hidden by default) -->
            <div id="event-detail-container" class="hidden">
                <div class="mb-4">
                    <button 
                        id="back-to-dashboard" 
                        onclick="EventDetail.navigateBack()"
                        class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-foreground hover:text-primary bg-muted/50 hover:bg-muted rounded-lg transition-colors"
                    >
                        <i data-lucide="arrow-left" class="h-4 w-4"></i>
                        <span data-i18n="js.dashboard.backToDashboard">Back to Dashboard</span>
                    </button>
                </div>
                <div id="event-detail-content" class="mx-auto max-w-4xl">
                    <!-- Rendered by EventDetail component -->
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 max-w-[420px]"></div>

    <!-- Participation Modal -->
    <div id="participation-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
        <div class="bg-card rounded-lg shadow-xl p-6 max-w-md w-full mx-4 border border-border">
            <h3 class="text-xl font-semibold mb-4 text-card-foreground"><span data-i18n="js.participation.reasonFor">Reason for </span><span id="modal-status-label"></span></h3>
            <textarea id="participation-reason"
                class="w-full px-3 py-2 border border-border rounded-md text-foreground bg-background focus:outline-none focus:ring-2 focus:ring-primary/30"
                rows="4" data-i18n-placeholder="js.participation.reasonOptional" placeholder="Optional reason..."></textarea>
            <div class="flex gap-3 mt-4 justify-end">
                <button id="modal-cancel" data-i18n="js.common.cancel"
                    class="px-4 py-2 border border-border rounded-md hover:bg-muted transition-colors text-foreground">Cancel</button>
                <button id="modal-confirm" data-i18n="js.common.confirm" class="px-4 py-2 rounded-md text-white transition-colors">Confirm</button>
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/badge.js"></script>
    <script src="assets/js/user-info.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/participation-constants.js"></script>
    <script src="assets/js/instrument-grouping.js"></script>
    <script src="assets/js/participation.js"></script>
    <script src="assets/js/participation-diagram.js"></script>
    <script src="assets/js/participant-overview.js"></script>
    <script src="assets/js/event-metadata.js"></script>
    <script src="assets/js/event-detail.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script>
        // Initialize Lucide icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }

        // Wait for i18n to be initialized, then check authentication
        (async () => {
            // Initialize i18n first if App is available
            if (typeof App !== 'undefined' && typeof i18n !== 'undefined') {
                await App.initI18n();
                // Wait for translations to load (up to 5 seconds)
                await new Promise((resolve) => {
                    const t = () => Object.keys(i18n.translations || {}).length > 0;
                    if (t()) {
                        resolve();
                        return;
                    }
                    const checkInterval = setInterval(() => {
                        if (t()) {
                            clearInterval(checkInterval);
                            resolve();
                        }
                    }, 100);
                    // Timeout after 5 seconds
                    setTimeout(() => {
                        clearInterval(checkInterval);
                        resolve(); // Continue even if translations didn't load
                    }, 5000);
                });
            }
            
            // Check authentication on page load
            const session = await Auth.redirectIfNotAuthenticated();
            
            // Initialize user info component
            if (typeof UserInfo !== 'undefined') {
                await UserInfo.init(session);
            }
            
            // Initialize sidebar (always visible, independent of dashboard)
            await Sidebar.init('dashboard');
            
            // Initialize dashboard
            Dashboard.init(session);
        })();
    </script>
</body>

</html>
