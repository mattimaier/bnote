<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BNote</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <div class="bg-card shadow-lg rounded-lg p-8">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-foreground mb-2">BNote</h1>
                <p class="text-muted-foreground">Ensemble Management System</p>
            </div>
            
            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-foreground mb-2">
                        Benutzername oder E-Mail
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        class="w-full px-4 py-2 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-background text-foreground"
                        placeholder="Benutzername oder E-Mail"
                    />
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-foreground mb-2">
                        Passwort
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        class="w-full px-4 py-2 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-background text-foreground"
                        placeholder="Passwort"
                    />
                </div>
                
                <div id="errorMessage" class="hidden bg-destructive/10 border border-destructive/20 text-destructive-foreground px-4 py-3 rounded-lg text-sm">
                </div>
                
                <button 
                    type="submit" 
                    id="loginButton"
                    class="w-full bg-primary hover:bg-primary/90 text-primary-foreground font-medium py-2 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
                >
                    Anmelden
                </button>
            </form>
        </div>
    </div>
    
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        // Redirect if already authenticated
        Auth.redirectIfAuthenticated();
        
        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loginButton = document.getElementById('loginButton');
            
            // Hide error message
            errorMessage.classList.add('hidden');
            
            // Disable button and show loading state
            loginButton.disabled = true;
            loginButton.textContent = 'Anmeldung...';
            
            try {
                await Auth.login(username, password);
                // Redirect to dashboard on success
                window.location.href = 'dashboard.html';
            } catch (error) {
                // Show error message
                errorMessage.textContent = error.message || 'Anmeldung fehlgeschlagen. Bitte überprüfen Sie Ihre Anmeldedaten.';
                errorMessage.classList.remove('hidden');
                
                // Re-enable button
                loginButton.disabled = false;
                loginButton.textContent = 'Anmelden';
            }
        });
    </script>
</body>
</html>
