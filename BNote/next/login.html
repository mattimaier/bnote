<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BNote</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="assets/js/tailwind-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <div class="bg-card shadow-lg rounded-lg p-8">
            <div class="text-center mb-8">
                <img src="../style/images/BNote_Logo_white_transparent.svg" alt="BNote" class="h-16 w-16 mx-auto mb-4" style="filter: brightness(0) saturate(100%) invert(58%) sepia(95%) saturate(2878%) hue-rotate(195deg) brightness(102%) contrast(101%);" />
                <h1 class="text-2xl font-bold text-foreground mb-2" data-i18n="js.common.appName">BNote</h1>
                <p class="text-muted-foreground" id="login-welcome-text">Welcome to %p</p>
            </div>
            
            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-foreground mb-2" data-i18n="js.login.usernameLabel">
                        Benutzername oder E-Mail
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        class="w-full px-4 py-2 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-background text-foreground"
                        data-i18n-placeholder="js.login.usernamePlaceholder"
                        placeholder="Benutzername oder E-Mail"
                    />
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-foreground mb-2" data-i18n="js.login.passwordLabel">
                        Passwort
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        class="w-full px-4 py-2 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-background text-foreground"
                        data-i18n-placeholder="js.login.passwordPlaceholder"
                        placeholder="Passwort"
                    />
                </div>
                
                <div id="errorMessage" class="hidden bg-destructive/10 border border-destructive/20 text-destructive-foreground px-4 py-3 rounded-lg text-sm">
                </div>
                
                <button 
                    type="submit" 
                    id="loginButton"
                    class="w-full bg-primary hover:bg-primary/90 text-primary-foreground font-medium py-2 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
                    data-i18n="js.login.login"
                >
                    Anmelden
                </button>
            </form>
        </div>
    </div>
    
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        // Initialize login page
        (async () => {
            // Redirect if already authenticated
            Auth.redirectIfAuthenticated();
            
            // Load public config (company name, lang, country) and initialize i18n
            try {
                let raw = null;
                if (typeof api !== 'undefined' && api.get) {
                    raw = await api.get('auth', 'getPublicConfig');
                } else {
                    const base = window.location.pathname.replace(/\/[^/]*$/, '');
                    const res = await fetch(base + '/api/index.php?module=auth&action=getPublicConfig');
                    const json = await res.json();
                    raw = json && json.data != null ? json.data : json;
                }
                const config = raw && typeof raw === 'object' ? raw : {};
                if (typeof i18n !== 'undefined') {
                    await i18n.init(config.lang || 'de', config.country || null);
                    await i18n.loadTranslations();
                    if (typeof i18n.translatePage === 'function') {
                        i18n.translatePage();
                    }
                    // Welcome text: "Welcome to {band/company name}"
                    const welcomeEl = document.getElementById('login-welcome-text');
                    if (welcomeEl) {
                        const company = config.company || '';
                        const welcomeText = (typeof i18n.t === 'function')
                            ? i18n.t('js.dashboard.subtitle', [company])
                            : ('Welcome to ' + company);
                        welcomeEl.textContent = welcomeText || 'Welcome to';
                    }
                }
            } catch (error) {
                console.warn('Failed to load public config:', error);
            }
            
            // Handle login form submission
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const errorMessage = document.getElementById('errorMessage');
                const loginButton = document.getElementById('loginButton');
                
                // Hide error message
                errorMessage.classList.add('hidden');
                
                // Disable button and show loading state
                loginButton.disabled = true;
                const t = (k) => (typeof i18n !== 'undefined' && i18n.t ? i18n.t(k) : k);
                loginButton.textContent = t('js.login.loggingIn') || 'Anmeldung...';
                
                try {
                    await Auth.login(username, password);
                    // Redirect to dashboard on success
                    window.location.href = 'dashboard.html';
                } catch (error) {
                    // Show error message
                    const errorMsg = error.message || (t('js.login.loginFailed') || 'Anmeldung fehlgeschlagen. Bitte überprüfen Sie Ihre Anmeldedaten.');
                    errorMessage.textContent = errorMsg;
                    errorMessage.classList.remove('hidden');
                    
                    // Re-enable button
                    loginButton.disabled = false;
                    loginButton.textContent = t('js.login.login') || 'Anmelden';
                }
            });
        })();
    </script>
</body>
</html>
