<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - BNote</title>
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen bg-background flex flex-col lg:flex-row">
    <!-- Left module sidebar - Always visible on desktop, toggleable on mobile -->
    <aside id="sidebar"
        class="flex flex-col h-screen bg-sidebar border-r border-sidebar-border transition-all duration-300 fixed inset-y-0 left-0 z-[60] w-64 xl:translate-x-0 -translate-x-full">
        <!-- Header with brand -->
        <div id="sidebar-header" class="flex items-center justify-between px-4 py-5 border-b border-sidebar-border/50">
            <div id="sidebar-brand" class="flex items-center gap-3">
                <div
                    class="h-9 w-9 rounded-lg bg-gradient-to-br from-primary/30 to-primary/10 flex items-center justify-center ring-1 ring-primary/20">
                    <img src="../style/images/BNote_Logo_white_transparent.svg" alt="BNote" class="h-5 w-5" style="filter: brightness(0) saturate(100%) invert(58%) sepia(95%) saturate(2878%) hue-rotate(195deg) brightness(102%) contrast(101%);" />
                </div>
                <div class="flex flex-col">
                    <span class="font-semibold text-sidebar-foreground text-sm">BNote</span>
                </div>
            </div>
            <button id="sidebar-collapse-btn"
                class="h-8 w-8 p-0 hover:bg-sidebar-accent/80 text-sidebar-foreground/60 hover:text-sidebar-foreground transition-colors rounded-md flex items-center justify-center"
                title="Collapse sidebar">
                <i data-lucide="chevron-left" class="h-4 w-4"></i>
            </button>
        </div>

        <!-- Modules list -->
        <nav class="flex-1 overflow-y-auto p-3 space-y-1.5" id="sidebar-nav">
            <!-- Sidebar items will be populated by sidebar.js -->
        </nav>
    </aside>

    <!-- Overlay for mobile/tablet when sidebar is open -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/30 xl:hidden z-30 hidden"></div>

    <!-- Main content area -->
    <div class="flex-1 flex flex-col min-w-0 xl:ml-64">
        <!-- Top Header Bar -->
        <header
            class="sticky top-0 z-50 w-full border-b border-border/40 bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/60">
            <div class="flex h-16 items-center justify-between px-4 lg:px-6 gap-4">
                <!-- Menu button - visible on mobile and tablet (compact devices) -->
                <button id="mobile-menu-btn"
                    class="xl:hidden h-9 w-9 text-muted-foreground hover:text-foreground hover:bg-muted/60 rounded-md flex items-center justify-center"
                    title="Toggle menu">
                    <i data-lucide="menu" class="h-5 w-5"></i>
                </button>

                <!-- Left: Search - hidden on mobile -->
                <div class="hidden md:flex flex-1 max-w-sm">
                    <div class="relative w-full">
                        <i data-lucide="search"
                            class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground/60"></i>
                        <input type="text" data-i18n-placeholder="js.contacts.searchPlaceholder" placeholder="Search contacts..."
                            class="pl-9 h-9 bg-muted/40 border-transparent text-sm focus:border-input focus:bg-muted/60 focus:ring-1 focus:ring-primary/30 rounded-md w-full px-3" />
                    </div>
                </div>

                <!-- Right side actions -->
                <div class="flex items-center gap-2 ml-auto">
                    <div class="h-6 w-px bg-border/30 hidden sm:block"></div>
                    <button
                        class="flex items-center gap-3 pl-3 pr-2 py-1 rounded-lg hover:bg-muted/50 transition-colors group"
                        onclick="Auth.logout()">
                        <div class="h-8 w-8 rounded-full bg-primary/10 text-primary font-semibold text-xs flex items-center justify-center ring-1.5 ring-primary/20 group-hover:ring-primary/40 transition-all"
                            id="user-avatar">
                            <span id="user-initials">U</span>
                        </div>
                        <div class="hidden sm:block text-left">
                            <p class="text-xs font-semibold leading-tight text-foreground" id="user-name">User</p>
                            <span
                                class="inline-flex items-center rounded-md border px-1.5 py-0.5 text-[10px] mt-0.5 bg-muted text-muted-foreground border-border"
                                id="user-role" data-i18n="js.common.member">Member</span>
                        </div>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main content -->
        <main class="px-4 py-6 lg:px-6 flex-1 overflow-y-auto">
            <div class="mx-auto max-w-7xl">
                <!-- Page title -->
                <div class="mb-6">
                    <h1 class="text-2xl font-semibold text-foreground" data-i18n="js.contacts.title">Contacts</h1>
                    <p class="text-sm text-muted-foreground mt-1" data-i18n="js.contacts.subtitle">Manage contacts, groups, and integrations</p>
                </div>

                <!-- Action buttons -->
                <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
                    <div class="flex items-center gap-3 flex-wrap">
                        <button id="add-contact-btn"
                            class="flex items-center gap-2 px-4 py-2.5 bg-primary text-primary-foreground rounded-lg hover:bg-primary/90 transition-colors text-sm font-medium shadow-sm hover:shadow">
                            <i data-lucide="plus" class="h-4 w-4"></i>
                            <span data-i18n="js.contacts.addContact">Add Contact</span>
                        </button>
                        <button id="integration-btn"
                            class="flex items-center gap-2 px-4 py-2.5 border border-border rounded-lg hover:bg-muted/50 transition-colors text-foreground text-sm font-medium">
                            <i data-lucide="box-arrow-in-up-right" class="h-4 w-4"></i>
                            <span data-i18n="js.contacts.integration">Integration</span>
                        </button>
                        <button id="groups-btn"
                            class="flex items-center gap-2 px-4 py-2.5 border border-border rounded-lg hover:bg-muted/50 transition-colors text-foreground text-sm font-medium">
                            <i data-lucide="people" class="h-4 w-4"></i>
                            <span data-i18n="js.contacts.groups">Groups</span>
                        </button>
                        <button id="print-btn"
                            class="flex items-center gap-2 px-4 py-2.5 border border-border rounded-lg hover:bg-muted/50 transition-colors text-foreground text-sm font-medium">
                            <i data-lucide="printer" class="h-4 w-4"></i>
                            <span data-i18n="js.contacts.print">Print</span>
                        </button>
                        <button id="vcard-btn"
                            class="flex items-center gap-2 px-4 py-2.5 border border-border rounded-lg hover:bg-muted/50 transition-colors text-foreground text-sm font-medium">
                            <i data-lucide="file-text" class="h-4 w-4"></i>
                            <span data-i18n="js.contacts.vcard">vCard</span>
                        </button>
                        <button id="privacy-btn"
                            class="flex items-center gap-2 px-4 py-2.5 border border-border rounded-lg hover:bg-muted/50 transition-colors text-foreground text-sm font-medium">
                            <i data-lucide="shield-alert" class="h-4 w-4"></i>
                            <span data-i18n="js.contacts.privacy">Privacy</span>
                        </button>
                    </div>
                    <button id="back-to-list-btn" class="hidden flex items-center gap-2 px-4 py-2.5 border border-border rounded-lg hover:bg-muted/50 transition-colors text-foreground text-sm font-medium">
                        <i data-lucide="arrow-left" class="h-4 w-4"></i>
                        <span data-i18n="js.contacts.backToList">Back to List</span>
                    </button>
                </div>

                <!-- List Mode -->
                <div id="list-mode">
                    <!-- Group tabs -->
                    <div id="group-tabs-container" class="mb-4"></div>

                    <!-- Search input -->
                    <div id="contacts-search-container" class="mb-4"></div>

                    <!-- Contacts table -->
                    <div class="bg-card rounded-xl border border-border/40 shadow-sm">
                        <div class="p-6">
                            <div id="contacts-table-container"></div>
                        </div>
                    </div>
                </div>

                <!-- Integration Mode -->
                <div id="integration-mode" class="hidden">
                    <div class="bg-card rounded-xl border border-border/40 shadow-sm p-6">
                        <h2 class="text-xl font-semibold mb-4" data-i18n="js.contacts.integration">Integration</h2>
                        <p class="text-muted-foreground" data-i18n="js.contacts.integrationComingSoon">Integration mode - coming soon</p>
                    </div>
                </div>

                <!-- Groups Management Mode -->
                <div id="groups-mode" class="hidden">
                    <div class="bg-card rounded-xl border border-border/40 shadow-sm">
                        <div class="p-6">
                            <div id="groups-table-container"></div>
                        </div>
                    </div>
                </div>

                <!-- Print Mode -->
                <div id="print-mode" class="hidden">
                    <div class="bg-card rounded-xl border border-border/40 shadow-sm p-6">
                        <h2 class="text-xl font-semibold mb-4" data-i18n="js.contacts.print">Print</h2>
                        <p class="text-muted-foreground" data-i18n="js.contacts.printComingSoon">Print mode - coming soon</p>
                    </div>
                </div>

                <!-- vCard Mode -->
                <div id="vcard-mode" class="hidden">
                    <div class="bg-card rounded-xl border border-border/40 shadow-sm p-6">
                        <h2 class="text-xl font-semibold mb-4" data-i18n="js.contacts.vcardImportExport">vCard Import/Export</h2>
                        <p class="text-muted-foreground" data-i18n="js.contacts.vcardComingSoon">vCard mode - coming soon</p>
                    </div>
                </div>

                <!-- Privacy/GDPR Mode -->
                <div id="privacy-mode" class="hidden">
                    <div class="bg-card rounded-xl border border-border/40 shadow-sm">
                        <div class="p-6">
                            <div class="flex items-center justify-between mb-4">
                                <h2 class="text-xl font-semibold" data-i18n="js.contacts.gdprStatus">GDPR Status</h2>
                                <div class="flex gap-2">
                                    <button id="generate-gdpr-codes-btn"
                                        class="px-4 py-2 border border-border rounded-lg hover:bg-muted/50 transition-colors text-foreground text-sm font-medium"
                                        data-i18n="js.contacts.generateCodes">
                                        Generate Codes
                                    </button>
                                    <button id="send-gdpr-mail-btn"
                                        class="px-4 py-2 border border-border rounded-lg hover:bg-muted/50 transition-colors text-foreground text-sm font-medium"
                                        data-i18n="js.contacts.sendMail">
                                        Send Mail
                                    </button>
                                    <button id="delete-gdpr-nok-btn"
                                        class="px-4 py-2 bg-destructive text-destructive-foreground rounded-lg hover:bg-destructive/90 transition-colors text-sm font-medium"
                                        data-i18n="js.contacts.deleteNonConsenting">
                                        Delete Non-Consenting
                                    </button>
                                </div>
                            </div>
                            <div id="gdpr-table-container"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Loading indicator -->
    <div id="loading-indicator" class="hidden fixed inset-0 bg-black/20 z-50 flex items-center justify-center">
        <div class="bg-card rounded-lg p-6 shadow-xl">
            <div class="flex items-center gap-3">
                <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-primary"></div>
                <span class="text-foreground" data-i18n="js.common.loading">Loading...</span>
            </div>
        </div>
    </div>

    <!-- Add Contact Modal -->
    <div id="add-contact-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-card rounded-lg shadow-xl p-6 max-w-2xl w-full border border-border max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-semibold text-card-foreground" data-i18n="js.contacts.addContactModalTitle">Add Contact</h3>
                <button data-modal-close="add-contact-modal" class="text-muted-foreground hover:text-foreground">
                    <i data-lucide="x" class="h-5 w-5"></i>
                </button>
            </div>
            <div id="add-contact-form-container"></div>
        </div>
    </div>

    <!-- Edit Contact Modal -->
    <div id="edit-contact-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-card rounded-lg shadow-xl p-6 max-w-2xl w-full border border-border max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-semibold text-card-foreground" data-i18n="js.contacts.editContactModalTitle">Edit Contact</h3>
                <button data-modal-close="edit-contact-modal" class="text-muted-foreground hover:text-foreground">
                    <i data-lucide="x" class="h-5 w-5"></i>
                </button>
            </div>
            <div id="edit-contact-form-container"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/badge.js"></script>
    <script src="assets/js/user-info.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/table.js"></script>
    <script src="assets/js/form.js"></script>
    <script src="assets/js/contacts.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            try {
                const session = await AuthApi.checkSession();
                if (!session || !session.authenticated) {
                    window.location.href = 'login.html';
                    return;
                }
                if (typeof App !== 'undefined' && typeof i18n !== 'undefined') {
                    await App.initI18n();
                    await new Promise((resolve) => {
                        if (Object.keys(i18n.translations || {}).length > 0) {
                            resolve();
                            return;
                        }
                        const iv = setInterval(() => {
                            if (Object.keys(i18n.translations || {}).length > 0) {
                                clearInterval(iv);
                                resolve();
                            }
                        }, 100);
                        setTimeout(() => { clearInterval(iv); resolve(); }, 5000);
                    });
                    if (typeof i18n.translatePage === 'function') i18n.translatePage();
                }
                
                // Initialize user info component
                if (typeof UserInfo !== 'undefined') {
                    await UserInfo.init(session);
                }
                
                await Sidebar.init();
                await Contacts.init(session);
            } catch (error) {
                console.error('Initialization error:', error);
                window.location.href = 'login.html';
            }
        });
    </script>
</body>

</html>
